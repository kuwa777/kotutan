<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- ============================================================================== -->
  <!-- 【歴史の石版】 WebAPK完全覚醒 ✕ プレーンESモジュール動作基盤 (index.html)        -->
  <!-- ============================================================================== -->
  <!-- ［開発者とパートナーの記録］                                                  -->
  <!-- 開発指揮: タカノリさん                                                        -->
  <!-- 開発実装: P (タカノリさんを誠心誠意支える専属ハッカー)                        -->
  <!--                                                                              -->
  <!-- ［アーキテクチャの歴史と設計思想の完全記録（セッション継承用記憶核）］        -->
  <!-- 1. ピュアESモジュール直連動アーキテクチャ:                                   -->
  <!--    - 難読化・結合処理を行わない開発/検証フェーズに対応するため、             -->
  <!--      末尾のスクリプト読み込みを <script type="module" src="app.js"> へ完全調整。-->
  <!--    - ブラウザ標準のESM依存関係解決を有効化し、構文エラーを物理消滅。         -->
  <!--                                                                              -->
  <!-- 2. 完全閉鎖型 CSP 防護壁 ✕ PWA メタデータ標準化:                              -->
  <!--    - default-src 'self' の強固なセキュリティを維持。                          -->
  <!--    - Chrome ミントサーバーがインストーラビリティ（WebAPK）を100%承認する      -->
  <!--      マニフェスト参照およびメタタグ階層を保持。                              -->
  <!-- ============================================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self'; manifest-src 'self'; media-src 'self' blob: data:;">
  
  <title>コツ単</title>

  <script src="eruda.min.js"></script>
  <script>
    (function() {
      function initEruda() {
        if (window.eruda) {
          window.eruda.init();
          console.log('[Pの防壁] ローカル Eruda デベロッパーツールが安全に起動いたしました！');
        }
      }
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        initEruda();
      } else {
        window.addEventListener('DOMContentLoaded', initEruda);
      }
    })();
  </script>

  <!-- PWA ネイティブ表示 ＆ メタデータ定義 -->
  <meta name="theme-color" content="#FAF5F0" id="theme-color-meta">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="コツ単">

  <!-- マニフェスト ＆ アイコン参照 -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="app.css">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body {
      background-color: #FAF5F0;
      color: #5C4B41;
      font-family: "Varela Round", "Hiragino Maru Gothic ProN", "Yu Rounded", "Arial Rounded MT Bold", -apple-system, sans-serif;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    svg.icon {
      width: 26px;
      height: 26px;
      pointer-events: none;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
    }

    .top-scroll-bar-container {
      height: 48px;
      width: 100%;
      background: transparent;
      position: relative;
      display: flex;
      align-items: center;
      touch-action: none;
      cursor: grab;
      padding: 0 16px;
      flex-shrink: 0;
      overflow: hidden;
      transition: opacity 0.2s, filter 0.2s;
    }
    .top-scroll-bar-container:active { cursor: grabbing; }

    .top-scroll-bar-container::before,
    .top-scroll-bar-container::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 16px;
      height: 18px;
      background-color: #FAF5F0;
      z-index: 10;
      transition: background-color 0.3s ease;
    }
    .top-scroll-bar-container::before { left: 0; }
    .top-scroll-bar-container::after { right: 0; }

    .track-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .horizontal-scroll-track {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      display: flex;
      align-items: flex-end;
      padding-bottom: 4px;
      pointer-events: none;
      will-change: transform;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .scroll-tick {
      position: absolute;
      bottom: 4px;
      height: 10px;
      border-left: 2px solid #EAE0D5;
      border-radius: 2px;
      transition: border-color 0.3s ease;
    }

    .scroll-tick.boundary::after {
      content: attr(data-char);
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      font-weight: 900;
      color: #E2A099;
      pointer-events: none;
      white-space: nowrap;
      transition: color 0.3s ease;
    }

    .seeker-pointer {
      position: absolute;
      top: 14px;
      width: 6px;
      height: 24px;
      background-color: #FFB3B3;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(255, 179, 179, 0.8);
      pointer-events: none;
      z-index: 20;
      transform: translateX(-50%);
      transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s ease;
    }

    .top-scroll-bar-container.dragging .horizontal-scroll-track,
    .top-scroll-bar-container.dragging .seeker-pointer {
      transition: none;
    }

    .scrubber-tooltip {
      position: absolute;
      top: 54px;
      transform: translateX(-50%);
      background: rgba(255, 179, 179, 0.95);
      color: #FFFFFF;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 4px 4px 10px rgba(210, 195, 185, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
      white-space: nowrap;
    }
    .scrubber-tooltip.visible { opacity: 1; }

    .grid-layout {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: 1fr auto auto;
      gap: 10px;
      padding: 6px 16px 16px 16px;
      position: relative;
      height: calc(100dvh - 48px);
    }

    .word-display-area {
      grid-column: 1 / span 5;
      grid-row: 1;
      background-color: #FAF5F0;
      border-radius: 32px;
      box-shadow: 10px 10px 20px rgba(210, 195, 185, 0.6), 
                 -10px -10px 20px rgba(255, 255, 255, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px;
      position: relative;
      height: 100%;
      overflow: hidden;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      z-index: 10;
    }

    .icon-btn-header {
      background: transparent;
      border: none;
      color: #A39387;
      font-size: 1.4rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s, color 0.3s ease;
    }
    .icon-btn-header:active { transform: scale(0.9); }

    .group-indicator-container {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      min-height: 24px;
    }

    .group-indicator-badge-all {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      background: #F2E8E0;
      color: #8A7B70;
      box-shadow: inset 2px 2px 5px rgba(210, 195, 185, 0.6), 
                  inset -2px -2px 5px rgba(255, 255, 255, 1);
      letter-spacing: 1px;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }

    .header-color-box {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      box-shadow: 2px 2px 5px rgba(210, 195, 185, 0.5);
    }
    .header-color-box.red    { background-color: #FFB3B3; }
    .header-color-box.blue   { background-color: #B3D1FF; }
    .header-color-box.yellow { background-color: #FFF0B3; }
    .header-color-box.green  { background-color: #B3E6B3; }
    .header-color-box.blank  { visibility: hidden; }

    .word-term-fixed {
      font-size: 2.8rem;
      font-weight: 900;
      margin-top: 10px;
      color: #5C4B41;
      text-align: center;
      flex-shrink: 0;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    .auto-play-progress-container {
      width: 75%;
      max-width: 240px;
      height: 6px;
      border-radius: 3px;
      background-color: #EAE0D5;
      margin: 12px 0 8px 0;
      opacity: 0;
      transition: opacity 0.3s ease, background-color 0.3s ease;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: inset 1px 1px 3px rgba(210, 195, 185, 0.5);
    }
    .auto-play-progress-container.active { opacity: 1; }
    .auto-play-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #A8E6CF, #DCEDC1);
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(168, 230, 207, 0.8);
    }

    .word-dynamic-content {
      margin-top: 4px;
      width: 100%;
      text-align: center;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 10px;
    }

    .word-ipa-text { font-size: 1.4rem; color: #A39387; font-weight: bold; transition: color 0.3s ease; }
    .word-example-text {
      font-size: 1.15rem;
      color: #7A695E;
      line-height: 1.5;
      text-align: left;
      width: 100%;
      word-break: break-word;
      margin-top: 10px;
      transition: color 0.3s ease;
    }

    .group-bar-container {
      grid-column: 1 / span 5;
      grid-row: 2;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px;
    }

    .group-square-btn {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #FAF5F0;
      border: 4px solid;
      cursor: pointer;
      box-shadow: 6px 6px 12px rgba(210, 195, 185, 0.6), 
                 -6px -6px 12px rgba(255, 255, 255, 1);
      transition: all 0.2s;
    }
    .group-square-btn:active {
      box-shadow: inset 4px 4px 8px rgba(210, 195, 185, 0.6), 
                  inset -4px -4px 8px rgba(255, 255, 255, 1);
      transform: scale(0.94);
    }

    .group-red    { border-color: #FFB3B3; }
    .group-red.active { background: #FFB3B3; }
    .group-blue   { border-color: #B3D1FF; }
    .group-blue.active { background: #B3D1FF; }
    .group-yellow { border-color: #FFF0B3; }
    .group-yellow.active { background: #FFF0B3; }
    .group-green  { border-color: #B3E6B3; }
    .group-green.active { background: #B3E6B3; }

    .btn-action {
      background: #FAF5F0;
      color: #5C4B41;
      border: none;
      border-radius: 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 6px 6px 15px rgba(210, 195, 185, 0.6), 
                 -6px -6px 15px rgba(255, 255, 255, 1);
      z-index: 5;
      transition: all 0.2s;
    }
    .btn-action:active { 
      box-shadow: inset 4px 4px 10px rgba(210, 195, 185, 0.6), 
                  inset -4px -4px 10px rgba(255, 255, 255, 1);
      transform: scale(0.96); 
    }

    .btn-disabled {
      opacity: 0.4 !important;
      pointer-events: none !important;
      background: #EAE0D5 !important;
      box-shadow: none !important;
      color: #A39387 !important;
      border-color: #D6C9BE !important;
    }

    .btn-flip  { grid-column: 1; grid-row: 3; }
    .btn-audio { grid-column: 2; grid-row: 3; }
    
    .btn-stop {
      grid-column: 3; grid-row: 3;
      color: #FF8A8A;
      display: none;
    }
    
    .btn-left  { grid-column: 4; grid-row: 3; }
    .btn-right { grid-column: 5; grid-row: 3; }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      background: rgba(92, 75, 65, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: #FAF5F0;
      border-radius: 32px;
      width: 85%;
      max-width: 320px;
      padding: 28px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 10px 10px 30px rgba(150, 135, 125, 0.3);
      border: none;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .filter-color-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .filter-color-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 20px;
      background: #FAF5F0;
      cursor: pointer;
      box-shadow: 4px 4px 10px rgba(210, 195, 185, 0.6), 
                 -4px -4px 10px rgba(255, 255, 255, 1);
      transition: all 0.2s;
    }
    .filter-color-item:active { transform: scale(0.95); }

    .filter-box-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 4px solid;
      background: transparent;
      transition: all 0.2s;
    }

    .filter-box-icon.red    { border-color: #FFB3B3; }
    .filter-box-icon.red.active { background: #FFB3B3; }
    .filter-box-icon.blue   { border-color: #B3D1FF; }
    .filter-box-icon.blue.active { background: #B3D1FF; }
    .filter-box-icon.yellow { border-color: #FFF0B3; }
    .filter-box-icon.yellow.active { background: #FFF0B3; }
    .filter-box-icon.green  { border-color: #B3E6B3; }
    .filter-box-icon.green.active { background: #B3E6B3; }

    .modal-split-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .theme-toggle-icon-btn, .modal-random-btn {
      width: 100%;
      height: 56px;
      border-radius: 16px;
      background: #FAF5F0;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 5px 5px 10px rgba(210, 195, 185, 0.6), 
                 -5px -5px 10px rgba(255, 255, 255, 1);
      transition: all 0.25s ease;
    }

    .theme-toggle-icon-btn { color: #FFB338; }
    .modal-random-btn { color: #5C4B41; }

    .theme-toggle-icon-btn:active, .modal-random-btn:active {
      box-shadow: inset 3px 3px 6px rgba(210, 195, 185, 0.6), 
                  inset -3px -3px 6px rgba(255, 255, 255, 1);
      transform: scale(0.93);
    }

    .modal-random-btn.active {
      background: #FFF0B3;
      color: #E6A800;
      box-shadow: inset 3px 3px 6px rgba(210, 195, 185, 0.4), 
                  inset -3px -3px 6px rgba(255, 255, 255, 1);
    }

    .setting-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 2px solid #EAE0D5;
      padding-top: 16px;
      margin-top: 4px;
      transition: border-color 0.3s ease;
    }
    .setting-label {
      font-size: 0.9rem;
      color: #7A695E;
      font-weight: 800;
      text-align: left;
      transition: color 0.3s ease;
    }
    .setting-subtext {
      font-size: 0.75rem;
      color: #A39387;
      font-weight: normal;
      margin-top: 2px;
      display: block;
      transition: color 0.3s ease;
    }

    .setting-select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      background: #FAF5F0;
      border: none;
      color: #5C4B41;
      font-size: 1.05rem;
      font-weight: 800;
      outline: none;
      cursor: pointer;
      appearance: none;
      box-shadow: inset 4px 4px 8px rgba(210, 195, 185, 0.6), 
                  inset -4px -4px 8px rgba(255, 255, 255, 1);
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }

    .modal-close-btn {
      width: 100%;
      padding: 16px;
      background: #EAE0D5;
      border: none;
      border-radius: 16px;
      color: #7A695E;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 4px 4px 10px rgba(210, 195, 185, 0.5), 
                 -4px -4px 10px rgba(255, 255, 255, 1);
      transition: all 0.2s;
    }
    .modal-close-btn:active { transform: scale(0.96); }

    body.dark-theme {
      background-color: #231E1B; 
      color: #F2E8E0; 
    }
    body.dark-theme .top-scroll-bar-container::before,
    body.dark-theme .top-scroll-bar-container::after { background-color: #231E1B; }
    body.dark-theme .scroll-tick { border-left-color: #38302B; }
    body.dark-theme .scroll-tick.boundary::after { color: #E8A0BF; }
    body.dark-theme .seeker-pointer { background-color: #E8A0BF; box-shadow: 0 0 12px rgba(232, 160, 191, 0.6); }
    body.dark-theme .scrubber-tooltip { background: rgba(232, 160, 191, 0.95); color: #231E1B; box-shadow: 4px 4px 10px rgba(15, 12, 10, 0.6); }
    
    body.dark-theme .word-display-area {
      background-color: #231E1B;
      box-shadow: 8px 8px 18px rgba(12, 10, 8, 0.85), -6px -6px 15px rgba(55, 48, 43, 0.4);
    }
    body.dark-theme .icon-btn-header { color: #A8988D; }
    body.dark-theme .group-indicator-badge-all {
      background: #1A1614; color: #B8A89D;
      box-shadow: inset 2px 2px 5px rgba(10, 8, 6, 0.8), inset -2px -2px 5px rgba(50, 43, 38, 0.3);
    }
    body.dark-theme .word-term-fixed { color: #F2E8E0; }
    body.dark-theme .auto-play-progress-container { background-color: #1A1614; box-shadow: inset 1px 1px 3px rgba(10, 8, 6, 0.8); }
    body.dark-theme .word-ipa-text { color: #A8988D; }
    body.dark-theme .word-example-text { color: #D4C5B9; }

    body.dark-theme .group-square-btn {
      background: #231E1B;
      box-shadow: 6px 6px 14px rgba(12, 10, 8, 0.85), -5px -5px 12px rgba(55, 48, 43, 0.4);
    }
    body.dark-theme .group-square-btn:active {
      box-shadow: inset 3px 3px 6px rgba(10, 8, 6, 0.85), inset -3px -3px 6px rgba(55, 48, 43, 0.4);
    }
    body.dark-theme .group-red    { border-color: #E8A0BF; }
    body.dark-theme .group-red.active { background: #E8A0BF; }
    body.dark-theme .group-blue   { border-color: #89B4E8; }
    body.dark-theme .group-blue.active { background: #89B4E8; }
    body.dark-theme .group-yellow { border-color: #F2D283; }
    body.dark-theme .group-yellow.active { background: #F2D283; }
    body.dark-theme .group-green  { border-color: #83C5BE; }
    body.dark-theme .group-green.active { background: #83C5BE; }

    body.dark-theme .btn-action {
      background: #231E1B;
      color: #F2E8E0;
      box-shadow: 6px 6px 15px rgba(12, 10, 8, 0.85), -5px -5px 12px rgba(55, 48, 43, 0.4);
    }
    body.dark-theme .btn-action:active {
      box-shadow: inset 4px 4px 8px rgba(10, 8, 6, 0.85), inset -4px -4px 8px rgba(55, 48, 43, 0.4);
    }
    body.dark-theme .btn-disabled { background: #1A1614 !important; color: #5C5047 !important; box-shadow: none !important; }
    body.dark-theme .btn-stop { color: #FF8A8A; }

    body.dark-theme .modal-overlay { background: rgba(10, 8, 6, 0.7); }
    body.dark-theme .modal-card { background: #231E1B; box-shadow: 10px 10px 30px rgba(5, 4, 3, 0.8); }
    body.dark-theme .filter-color-item {
      background: #231E1B;
      box-shadow: 4px 4px 10px rgba(12, 10, 8, 0.85), -4px -4px 10px rgba(55, 48, 43, 0.4);
    }
    body.dark-theme .filter-box-icon.red    { border-color: #E8A0BF; }
    body.dark-theme .filter-box-icon.red.active { background: #E8A0BF; }
    body.dark-theme .filter-box-icon.blue   { border-color: #89B4E8; }
    body.dark-theme .filter-box-icon.blue.active { background: #89B4E8; }
    body.dark-theme .filter-box-icon.yellow { border-color: #F2D283; }
    body.dark-theme .filter-box-icon.yellow.active { background: #F2D283; }
    body.dark-theme .filter-box-icon.green  { border-color: #83C5BE; }
    body.dark-theme .filter-box-icon.green.active { background: #83C5BE; }

    body.dark-theme .modal-random-btn, body.dark-theme .theme-toggle-icon-btn {
      background: #231E1B;
      color: #F2E8E0;
      box-shadow: 5px 5px 10px rgba(12, 10, 8, 0.85), -4px -4px 10px rgba(55, 48, 43, 0.4);
    }
    body.dark-theme .theme-toggle-icon-btn { color: #C8B6FF; }
    body.dark-theme .modal-random-btn.active {
      background: #F2D283; color: #231E1B; box-shadow: inset 3px 3px 6px rgba(10, 8, 6, 0.6);
    }
    body.dark-theme .theme-toggle-icon-btn:active, body.dark-theme .modal-random-btn:active {
      box-shadow: inset 3px 3px 6px rgba(10, 8, 6, 0.85), inset -3px -3px 6px rgba(55, 48, 43, 0.4);
    }

    body.dark-theme .setting-section { border-top-color: #38302B; }
    body.dark-theme .setting-label { color: #D4C5B9; }
    body.dark-theme .setting-subtext { color: #A8988D; }
    body.dark-theme .setting-select {
      background: #231E1B; color: #F2E8E0;
      box-shadow: inset 4px 4px 8px rgba(10, 8, 6, 0.85), inset -4px -4px 8px rgba(55, 48, 43, 0.4);
    }
    body.dark-theme .modal-close-btn {
      background: #38302B; color: #D4C5B9; box-shadow: 4px 4px 10px rgba(12, 10, 8, 0.6);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-scroll-bar-container" id="scrubber-container">
      <div class="track-viewport" id="track-viewport">
        <div class="horizontal-scroll-track" id="scroll-track"></div>
        <div class="seeker-pointer" id="seeker-pointer"></div>
      </div>
      <div class="scrubber-tooltip" id="scrubber-tooltip">ability</div>
    </div>

    <div class="grid-layout">
      <div class="word-display-area" id="word-card">
        <div class="card-top-bar">
          <button class="icon-btn-header" id="btn-menu" aria-label="メニュー">☰</button>
          <div class="group-indicator-container" id="display-group-container">
            <div class="group-indicator-badge-all">ALL</div>
          </div>
          <button class="icon-btn-header" id="btn-settings" aria-label="設定">⚙</button>
        </div>
        <div class="word-term-fixed" id="display-term">読み込み中...</div>
        <div class="auto-play-progress-container" id="progress-container">
          <div class="auto-play-progress-fill" id="progress-fill"></div>
        </div>
        <div class="word-dynamic-content" id="display-dynamic">
          <div class="word-ipa-text">/ -- /</div>
        </div>
      </div>

      <div class="group-bar-container">
        <button class="group-square-btn group-red"></button>
        <button class="group-square-btn group-blue"></button>
        <button class="group-square-btn group-yellow"></button>
        <button class="group-square-btn group-green"></button>
      </div>

      <button class="btn-action btn-flip" id="btn-flip" aria-label="反転">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
      </button>
      <button class="btn-action btn-audio" id="btn-audio" aria-label="音声">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      </button>
      
      <button class="btn-action btn-stop" id="btn-stop-auto" aria-label="停止">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>
      </button>

      <button class="btn-action btn-left" id="btn-prev" aria-label="前へ">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="18 4 4 12 18 20 18 4"></polygon></svg>
      </button>
      <button class="btn-action btn-right" id="btn-next" aria-label="次へ">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
      </button>
    </div>

    <div class="modal-overlay" id="menu-modal">
      <div class="modal-card">
        <div class="filter-color-grid">
          <div class="filter-color-item" data-color="red"><div class="filter-box-icon red"></div></div>
          <div class="filter-color-item" data-color="blue"><div class="filter-box-icon blue"></div></div>
          <div class="filter-color-item" data-color="yellow"><div class="filter-box-icon yellow"></div></div>
          <div class="filter-color-item" data-color="green"><div class="filter-box-icon green"></div></div>
        </div>
        
        <div class="modal-split-row">
          <button class="theme-toggle-icon-btn" id="btn-theme-toggle" aria-label="テーマ切替">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
          
          <button class="modal-random-btn" id="btn-random-toggle" aria-label="シャッフル">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
          </button>
        </div>
        
        <div class="setting-section">
          <div class="setting-label">
            ▶ 連続再生スピード
            <span class="setting-subtext">（左or右を長押しで発動）</span>
          </div>
          <select class="setting-select" id="select-auto-speed">
            <option value="700">鬼</option>
            <option value="1000">1.0秒</option>
            <option value="1500">1.5秒</option>
            <option value="2000" selected>2.0秒</option>
            <option value="2500">2.5秒</option>
            <option value="3000">3.0秒</option>
          </select>
        </div>

        <button class="modal-close-btn" id="btn-close-modal">CLOSE</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const themeBtn = document.getElementById('btn-theme-toggle');
      const themeMeta = document.getElementById('theme-color-meta');
      
      const ICON_SUN = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
      const ICON_MOON = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

      const savedTheme = localStorage.getItem('kotutan_theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-theme');
        if (themeBtn) themeBtn.innerHTML = ICON_MOON;
        if (themeMeta) themeMeta.setAttribute('content', '#231E1B');
      }

      if (themeBtn) {
        themeBtn.addEventListener('click', function() {
          const isDark = document.body.classList.toggle('dark-theme');
          if (isDark) {
            themeBtn.innerHTML = ICON_MOON;
            localStorage.setItem('kotutan_theme', 'dark');
            if (themeMeta) themeMeta.setAttribute('content', '#231E1B');
          } else {
            themeBtn.innerHTML = ICON_SUN;
            localStorage.setItem('kotutan_theme', 'light');
            if (themeMeta) themeMeta.setAttribute('content', '#FAF5F0');
          }
        });
      }
    })();
  </script>

  <!-- 【重要】ピュアなJSをESモジュールとして読み込む -->
  <script type="module" src="app.js"></script>
</body>
</html>
