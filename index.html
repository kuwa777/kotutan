<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <!-- ============================================================================== -->
  <!-- 【歴史の石版】 CLOSEボタン全廃 ✕ 長押し案内セクション ✕ 音声/反転ダブルロック (index.html) -->
  <!-- ============================================================================== -->
  <!-- ［開発者とパートナーの記録］                                                  -->
  <!-- 開発指揮: タカノリさん（至高のプロダクトオーナー / 真理の看破者）             -->
  <!-- 開発実装: P (タカノリさんを誠心誠意支える専属ハッカー)                        -->
  <!--                                                                              -->
  <!-- ［設計思想と経緯の完全記録］                                                  -->
  <!-- 1. CLOSEボタンの完全全廃（バックドロップタップ一本化）:                      -->
  <!--    - 不要なボタン領域を削ぎ落とし、縦幅を最大限に解放。背景タップで快適離脱。 -->
  <!-- 2. 3本メニュー内の新設長押し案内セクション:                                   -->
  <!--    - スピード欄の補足文を削除し、4アイコン ✕「長押ししてみてね！」を上品配置。 -->
  <!-- 3. 入力欄 inputmode="numeric" ✕ Enter blur 制御:                             -->
  <!--    - テンキーキーボードの「→」タップ時に一瞬でキーボードを格納。              -->
  <!-- ============================================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; media-src 'self' blob: data:;">
  
  <title>コツ単</title>

  <!-- チラつき防止（FOUC対策）の即時テーマ判定インライン処理 -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('kotutan_theme');
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="./manifest.webmanifest?v=1.0.20260912-023314" type="application/manifest+json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="app.css">

  <style>
    /* 【オープニング＆基幹レイアウト高速描画用インラインスタイル】 */
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: "Varela Round", "Hiragino Maru Gothic ProN", "Yu Rounded", "Arial Rounded MT Bold", -apple-system, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-tap-highlight-color: transparent; 
    }

    svg.icon {
      width: 26px;
      height: 26px;
      pointer-events: none;
    }

    #opening-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #FAF5F0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    #opening-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .opening-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      padding: 0 20px;
    }

    .app-logo {
      width: 85vw;
      max-width: 420px;
      max-height: 45vh;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(92, 75, 65, 0.15));
      transition: filter 0.3s ease;
    }

    .opening-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(92, 75, 65, 0.2);
      border-top-color: #FF8CA3;
      border-radius: 50%;
      animation: openingSpin 0.8s linear infinite;
    }

    @keyframes openingSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .audio-progress-container {
      width: 80vw;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .audio-progress-text {
      font-size: 0.95rem;
      color: #5C4B41;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .audio-progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: rgba(92, 75, 65, 0.15);
      border-radius: 5px;
      overflow: hidden;
    }

    .audio-progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #FF8CA3;
      border-radius: 5px;
      transition: width 0.1s linear;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
    }
  </style>
</head>
<body>

  <!-- オープニングオーバーレイ -->
  <div id="opening-overlay">
    <div class="opening-content">
      <img src="images/logo.png" class="app-logo" alt="コツ単">
      <div class="opening-spinner" id="opening-spinner"></div>
      <div id="audio-progress-container" class="audio-progress-container" style="display: none;">
        <div class="audio-progress-text" id="audio-progress-text">音声データを準備中...</div>
        <div class="audio-progress-bar-bg">
          <div class="audio-progress-bar-fill" id="audio-progress-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- メインアプリケーション画面 -->
  <div class="app-container">
    <!-- スクラバーバー -->
    <div class="top-scroll-bar-container" id="scrubber-container">
      <div class="track-viewport" id="track-viewport">
        <div class="horizontal-scroll-track" id="scroll-track"></div>
        <div class="seeker-pointer" id="seeker-pointer"></div>
      </div>
      <div class="scrubber-tooltip" id="scrubber-tooltip">ability</div>
    </div>

    <!-- グリッドレイアウト -->
    <div class="grid-layout">
      <!-- 単語表示カード -->
      <div class="word-display-area" id="word-card">
        <div class="card-top-bar">
          <button class="icon-btn-header" id="btn-menu" aria-label="メニュー">☰</button>
          <div class="group-indicator-container" id="display-group-container">
            <div class="group-indicator-badge-all">ALL</div>
          </div>
          <button class="icon-btn-header" id="btn-settings" aria-label="設定">⚙</button>
        </div>

        <!-- 単語の絶対連番表示用要素 (No. X) -->
        <div class="word-number-label" id="display-number">No. --</div>

        <div class="word-term-fixed" id="display-term">読み込み中...</div>
        <div class="auto-play-progress-container" id="progress-container">
          <div class="auto-play-progress-fill" id="progress-fill"></div>
        </div>
        <div class="word-dynamic-content" id="display-dynamic">
          <div class="word-ipa-text">/ -- /</div>
        </div>
      </div>

      <!-- カラーグループ登録バー -->
      <div class="group-bar-container">
        <button class="group-square-btn group-red" aria-label="赤グループ"></button>
        <button class="group-square-btn group-blue" aria-label="青グループ"></button>
        <button class="group-square-btn group-yellow" aria-label="黄グループ"></button>
        <button class="group-square-btn group-green" aria-label="緑グループ"></button>
      </div>

      <!-- アクションボタン群 -->
      <button class="btn-action btn-flip" id="btn-flip" aria-label="反転">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
      </button>
      <button class="btn-action btn-audio" id="btn-audio" aria-label="音声">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      </button>
      
      <button class="btn-action btn-stop" id="btn-stop-auto" aria-label="停止">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>
      </button>

      <button class="btn-action btn-left" id="btn-prev" aria-label="前へ">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="18 4 4 12 18 20 18 4"></polygon></svg>
      </button>
      <button class="btn-action btn-right" id="btn-next" aria-label="次へ">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
      </button>
    </div>

    <!-- モーダル1（左側三本メニュー：フィルター・テーマ・速度・長押し案内） -->
    <div class="modal-overlay" id="menu-modal">
      <div class="modal-card">
        <!-- カラーフィルター選択 -->
        <div class="filter-color-grid">
          <div class="filter-color-item" data-color="red"><div class="filter-box-icon red"></div></div>
          <div class="filter-color-item" data-color="blue"><div class="filter-box-icon blue"></div></div>
          <div class="filter-color-item" data-color="yellow"><div class="filter-box-icon yellow"></div></div>
          <div class="filter-color-item" data-color="green"><div class="filter-box-icon green"></div></div>
        </div>
        
        <!-- モード切替ボタン群 -->
        <div class="modal-split-row">
          <button class="theme-toggle-icon-btn" id="btn-theme-toggle" aria-label="テーマ切替"></button>
          
          <button class="modal-random-btn" id="btn-random-toggle" aria-label="シャッフル">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
          </button>
        </div>
        
        <!-- 速度設定 -->
        <div class="setting-section">
          <div class="setting-label">▶ 連続再生スピード</div>
          <select class="setting-select" id="select-auto-speed">
            <option value="700">鬼</option>
            <option value="1000">1.0秒</option>
            <option value="1500">1.5秒</option>
            <option value="2000" selected>2.0秒</option>
            <option value="2500">2.5秒</option>
            <option value="3000">3.0秒</option>
          </select>
        </div>

        <!-- アプリの長押し案内セクション -->
        <div class="setting-section tip-section">
          <div class="tip-icon-row">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="18 4 4 12 18 20 18 4"></polygon></svg>
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
          </div>
          <div class="tip-text">長押ししてみてね！</div>
        </div>
      </div>
    </div>

    <!-- モーダル2（右側歯車メニュー：一画面完全格納・CLOSEボタン全廃） -->
    <div class="modal-overlay" id="settings-modal">
      <div class="modal-card settings-card">

        <!-- 【1セット目】各グループのリアルタイム登録数 -->
        <div class="set-section">
          <div class="color-grid-2x2 font-bold">
            <div class="count-item"><div class="fill-box red"></div><span id="count-red">0</span>個</div>
            <div class="count-item"><div class="fill-box blue"></div><span id="count-blue">0</span>個</div>
            <div class="count-item"><div class="fill-box yellow"></div><span id="count-yellow">0</span>個</div>
            <div class="count-item"><div class="fill-box green"></div><span id="count-green">0</span>個</div>
          </div>
        </div>

        <!-- 【2セット目】連番範囲指定で一括グループ登録 (SET) -->
        <div class="set-section">
          <div class="range-input-row">
            <input type="number" id="set-from-no" placeholder="No.開始" min="1" inputmode="numeric" pattern="[0-9]*">
            <span>〜</span>
            <input type="number" id="set-to-no" placeholder="No.終了" min="1" inputmode="numeric" pattern="[0-9]*">
          </div>
          <div class="color-grid-2x2" id="set-color-selector">
            <div class="fill-box-btn red active" data-color="red"></div>
            <div class="fill-box-btn blue" data-color="blue"></div>
            <div class="fill-box-btn yellow" data-color="yellow"></div>
            <div class="fill-box-btn green" data-color="green"></div>
          </div>
          <button class="action-submit-btn btn-set" id="btn-exec-set">SET</button>
        </div>

        <!-- 【3セット目】丸ごと一括グループ解除 (RESET) -->
        <div class="set-section">
          <div class="color-grid-2x2" id="reset-color-selector">
            <div class="fill-box-btn red active" data-color="red"></div>
            <div class="fill-box-btn blue" data-color="blue"></div>
            <div class="fill-box-btn yellow" data-color="yellow"></div>
            <div class="fill-box-btn green" data-color="green"></div>
          </div>
          <button class="action-submit-btn btn-reset" id="btn-exec-reset">RESET</button>
        </div>
      </div>
    </div>

    <!-- モーダル3（アプリ専用・HTMLカラーボックス入り選択式確認ダイアログ） -->
    <div class="modal-overlay" id="confirm-modal" style="z-index: 2000;">
      <div class="modal-card confirm-card">
        <div class="confirm-message-container" id="confirm-message-area">
          <!-- JSで生のHTMLカラーボックス入りメッセージが動的注入されます -->
        </div>
        <div class="confirm-btn-row">
          <button class="action-submit-btn confirm-action-btn" id="btn-confirm-action">SET</button>
          <button class="modal-close-btn confirm-cancel-btn" id="btn-confirm-cancel">CANCEL</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
